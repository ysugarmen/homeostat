# Packaged by scripts/package-desktop.mjs from a staged copy with production dependencies.
appId: io.github.ysugarmen.homeostat
productName: Homeostat
copyright: Copyright © Yonatan Sugarmen
files:
  - package.json
  - dist/src/**/*.js
  - dist/src/**/*.cjs
  - "!dist/src/**/*.map"
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  # Ad-hoc signed, not with a Developer ID: macOS asks once before the first launch (see
  # docs/guide/desktop.md). Unsigned would be refused outright on Apple Silicon as "damaged".
  identity: "-"
  # Hardened runtime is for notarization, which needs a Developer ID; ad-hoc it only breaks launch.
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  title: Homeostat ${version}
