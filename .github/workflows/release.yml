name: release

# Publishes every package when a v* tag is pushed. npm trusted publishing (OIDC) means no npm
# token is stored anywhere, and each package carries a provenance attestation linking it to this
# workflow run. Configure the trusted publisher for each package on npmjs.com first (see
# docs/releasing.md). Provenance requires the repository to be public.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the release version
        run: test "v$(node -p 'require("./packages/cli/package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - name: Pack
        run: |
          mkdir -p out
          for p in core mcp dashboard cli; do (cd "packages/$p" && pnpm pack --pack-destination ../../out); done
      - name: SBOM of the published dependency tree
        run: |
          mkdir -p sbom && cd sbom && npm init -y > /dev/null
          npm install --no-audit --no-fund ../out/*.tgz
          npm sbom --sbom-format cyclonedx --omit dev > ../out/homeostat-sbom.cdx.json
      - name: Publish with provenance
        env:
          # Only for a package's first release, before a trusted publisher can be attached to it.
          # Remove the NPM_TOKEN secret once trusted publishing is set up; OIDC needs no token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The ./ matters: npm reads a bare "out/name.tgz" as a GitHub owner/repo shorthand.
          for f in ./out/homeostat-core-*.tgz ./out/homeostat-mcp-*.tgz ./out/homeostat-dashboard-*.tgz ./out/homeostat-[0-9]*.tgz; do
            npm publish "$f" --provenance --access public
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --verify-tag --generate-notes
